<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" stroke="#64413A" stroke-linecap="round" stroke-linejoin="round">
  <!-- Background art for page headers: a data / project-management collage.
       Colour is baked in; CSS fades it with opacity. -->

  <!-- Dotted grid -->
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#64413A" stroke="none"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#dots)" stroke="none" opacity="0.5"/>

  <!-- Rising line chart across the bottom, with data points -->
  <polyline stroke-width="4" points="40,700 160,640 260,668 380,560 500,590 620,470 740,500 860,380 980,410 1120,260"/>
  <g fill="#64413A" stroke="none">
    <circle cx="160" cy="640" r="9"/><circle cx="380" cy="560" r="9"/>
    <circle cx="620" cy="470" r="9"/><circle cx="860" cy="380" r="9"/>
    <circle cx="1120" cy="260" r="11"/>
  </g>
  <!-- Arrow tip on the trend -->
  <polyline stroke-width="4" points="1078,262 1120,260 1112,302"/>

  <!-- Bar chart, lower left -->
  <g stroke-width="3">
    <line x1="40" y1="780" x2="330" y2="780"/>
    <rect x="60" y="720" width="34" height="60" rx="4"/>
    <rect x="114" y="690" width="34" height="90" rx="4"/>
    <rect x="168" y="705" width="34" height="75" rx="4"/>
    <rect x="222" y="650" width="34" height="130" rx="4"/>
    <rect x="276" y="620" width="34" height="160" rx="4"/>
  </g>

  <!-- Gantt / project timeline, top right -->
  <g stroke-width="3">
    <line x1="760" y1="40" x2="760" y2="230"/>
    <line x1="760" y1="230" x2="1160" y2="230"/>
    <rect x="780" y="60" width="140" height="24" rx="12"/>
    <rect x="860" y="104" width="170" height="24" rx="12"/>
    <rect x="960" y="148" width="120" height="24" rx="12"/>
    <rect x="1030" y="192" width="110" height="24" rx="12"/>
    <line x1="1000" y1="40" x2="1000" y2="230" stroke-dasharray="6 10"/>
    <!-- check marks on finished tasks -->
    <polyline points="934,64 942,74 958,56"/>
    <polyline points="1044,108 1052,118 1068,100"/>
  </g>

  <!-- Donut chart, upper left -->
  <g stroke-width="3">
    <circle cx="150" cy="150" r="70"/>
    <circle cx="150" cy="150" r="38"/>
    <path d="M150 80 A70 70 0 0 1 216 173" stroke-width="16"/>
  </g>

  <!-- Small scatter cluster, middle -->
  <g fill="#64413A" stroke="none" opacity="0.8">
    <circle cx="520" cy="200" r="6"/><circle cx="556" cy="176" r="6"/>
    <circle cx="590" cy="210" r="6"/><circle cx="612" cy="160" r="6"/>
    <circle cx="648" cy="140" r="6"/><circle cx="676" cy="176" r="6"/>
  </g>

  <!-- Checklist, right middle -->
  <g stroke-width="3">
    <rect x="1040" y="470" width="26" height="26" rx="4"/>
    <polyline points="1046,483 1052,490 1062,476"/>
    <line x1="1082" y1="483" x2="1160" y2="483"/>
    <rect x="1040" y="514" width="26" height="26" rx="4"/>
    <polyline points="1046,527 1052,534 1062,520"/>
    <line x1="1082" y1="527" x2="1140" y2="527"/>
    <rect x="1040" y="558" width="26" height="26" rx="4"/>
    <line x1="1082" y1="571" x2="1150" y2="571"/>
  </g>
</svg>
